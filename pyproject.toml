[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar2svg"
version = "0.1.0"
description = "Convert Grok-bot-like flat-color avatars into SVG"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
validate = ["resvg-py"]

[project.scripts]
avatar2svg = "avatar2svg.__main__:main"

[tool.setuptools]
packages = ["avatar2svg"]
