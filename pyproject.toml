[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-avatar2svg"
version = "0.1.0"
description = "Convert Grok bot-style raster avatars into transparent SVGs"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
validate = ["resvg-py"]

[project.scripts]
grok-avatar2svg = "grok_avatar2svg.__main__:main"

[tool.setuptools]
packages = ["grok_avatar2svg"]
